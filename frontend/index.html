<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="brand_logo.png">
    <title>UPDATEX | Pro Market Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #f5f7fa;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --card-bg: #ffffff;
            --card-hover: #f0f4f8;
            --accent-blue: #2563eb;
            --accent-purple: #9333ea;
            --accent-gradient: linear-gradient(135deg, #2563eb, #9333ea);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --border-color: rgba(0, 0, 0, 0.1);
            --success: #16a34a;
            --warning: #ca8a04;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(61, 138, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
        }

        /* --- Top Header Layout --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .top-header {
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo-area h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }



        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Multi-Column Grid --- */
        .content-area { 
            flex: 1; 
            padding: 20px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        .main-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            flex-shrink: 0;
        }
        .main-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .main-tab:hover {
            color: var(--text-primary);
        }
        .main-tab.active {
            color: var(--accent-blue);
        }
        .main-tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-blue);
        }
        .main-tab-pane {
            display: none;
            height: 100%;
            overflow: hidden;
            flex: 1;
        }
        .main-tab-pane.active {
            display: flex;
            flex-direction: column;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 20px;
            height: 100%;
        }



        .column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            padding: 16px;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .column-header h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .feed-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        /* Smaller cards for 4-column layout */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            height: auto;
            position: relative;
        }
        .card-category {
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.8;
            margin-top: 2px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card:hover { background: var(--card-hover); transform: translateY(-4px); }
        .card-meta { display: flex; justify-content: space-between; align-items: center; }
        .source-tag { font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
        .card-body { 
            font-size: 0.85rem; 
            color: var(--text-secondary); 
            line-height: 1.5; 
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6; /* Show first 6 lines */
            -webkit-box-orient: vertical;
            transition: all 0.3s ease;
        }
        .card-body.expanded {
            -webkit-line-clamp: unset;
        }
        .read-more-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            margin-top: 4px;
            display: none; /* Shown via JS if needed */
        }
        .pdf-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(61, 138, 255, 0.1);
            color: #3d8aff;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid rgba(61, 138, 255, 0.2);
        }
        .pdf-link:hover {
            background: #3d8aff;
            color: white;
            transform: scale(1.05);
        }
        .card-symbol { font-size: 0.75rem; font-weight: 600; color: var(--accent-blue); background: rgba(61, 138, 255, 0.1); padding: 2px 6px; border-radius: 4px; width: fit-content; }
        .card-body { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }
        .card-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .pulse {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(63, 185, 80, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-in { animation: fadeInUp 0.4s ease; }

        /* --- Responsive Queries --- */
        @media (max-width: 900px) {
            .main-grid { 
                grid-template-columns: 1fr;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }
            .column { height: auto; min-height: 300px; }
            .top-header { 
                flex-wrap: wrap; 
                height: auto; 
                padding: 10px 15px; 
                gap: 10px; 
            }
            .status-area { order: 2; }
            .logo-area { order: 1; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        
        /* Listings Tabbed UI */
        .listing-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .listing-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .listing-tab:hover {
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.05);
        }
        .listing-tab.active {
            background: rgba(61, 138, 255, 0.15);
            color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(61, 138, 255, 0.1);
        }
        .listing-pane {
            display: none;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .listing-pane.active {
            display: flex;
        }

        /* --- Analysis Tab Styles --- */
        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .search-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 99;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: none;
            margin-top: 4px;
        }
        .autocomplete-items div {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .autocomplete-items div:hover, .autocomplete-active {
            background-color: var(--card-hover);
            color: var(--accent-blue);
            font-weight: 600;
        }
        .analysis-results {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
            flex: 1;
        }
        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .script-header h2 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-blue);
        }
        .ltp-box {
            text-align: right;
        }
        .ltp-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .ltp-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .table-container {
            overflow-x: auto;
            flex: 1;
            overflow-y: auto;
        }
        .historical-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .historical-table th, .historical-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .historical-table th {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            background: rgba(0,0,0,0.02);
            position: sticky;
            top: 0;
        }
        .historical-table td {
            font-size: 0.95rem;
        }
        .up-day { color: var(--success); }
        .down-day { color: #ef4444; }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- New Header -->
        <header class="top-header">
            <div class="logo-area">
                <h2>UPDATEX</h2>
            </div>

            <div class="status-area">
                <div class="status-pill">
                    <span class="pulse"></span> <span id="backend-status">Connected</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="content-area">
                <div class="main-tabs">
                    <button class="main-tab active" data-target="announcements">Announcements</button>
                    <button class="main-tab" data-target="check-script">Check Script</button>
                </div>

                <div id="tab-announcements" class="main-tab-pane active">
                    <div class="main-grid">

                        <!-- NSE — Left 50% -->
                    <div class="column">
                        <div class="column-header">
                            <h3>NSE Announcements</h3>
                            <span style="font-size: 0.7rem; color: #3d8aff;">LIVE</span>
                        </div>
                        <div id="feed-nse" class="feed-container"></div>
                    </div>

                    <!-- BSE — Right 50% -->
                    <div class="column">
                        <div class="column-header">
                            <h3>BSE Announcements</h3>
                            <span style="font-size: 0.7rem; color: #a855f7;">LIVE</span>
                        </div>
                        <div id="feed-bse" class="feed-container"></div>
                    </div>



                    </div>
                </div>

                <div id="tab-check-script" class="main-tab-pane">
                    <div style="display: flex; flex-direction: column; height: 100%;">
                        <div class="search-wrapper">
                            <input type="text" id="script-search" placeholder="Type a script name (e.g. RELIANCE, TCS) ..." autocomplete="off">
                            <div id="autocomplete-list" class="autocomplete-items"></div>
                        </div>
                        
                        <div id="analysis-loading" style="display: none; padding: 40px; text-align: center; color: var(--text-secondary);">
                            <div class="pulse" style="display: inline-block; margin-bottom: 10px;"></div>
                            <p>Loading analysis...</p>
                        </div>

                        <div id="analysis-results" class="analysis-results" style="display: none;">
                            <div class="script-header">
                                <h2 id="script-name">--</h2>
                                <div class="ltp-box">
                                    <span class="ltp-label">LTP</span>
                                    <span id="script-ltp" class="ltp-value">--</span>
                                </div>
                            </div>
                            
                            <div id="analysis-dashboard" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
                                <div style="background: rgba(37, 99, 235, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(37, 99, 235, 0.1);">
                                    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">Overall Trend</div>
                                    <div id="trend-val" style="font-size: 1.1rem; font-weight: 700; margin-top: 5px; color: var(--text-primary);">--</div>
                                </div>
                                <div style="background: rgba(37, 99, 235, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(37, 99, 235, 0.1);">
                                    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">Moving Averages</div>
                                    <div style="font-size: 0.9rem; font-weight: 600; margin-top: 5px;">50 SMA: <span id="sma50-val">--</span></div>
                                    <div style="font-size: 0.9rem; font-weight: 600; margin-top: 2px;">200 SMA: <span id="sma200-val">--</span></div>
                                </div>
                                <div style="background: rgba(37, 99, 235, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(37, 99, 235, 0.1);">
                                    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">Key Levels (52W)</div>
                                    <div style="font-size: 0.9rem; font-weight: 600; margin-top: 5px; color: var(--success);">Resistance: <span id="res-val">--</span></div>
                                    <div style="font-size: 0.9rem; font-weight: 600; margin-top: 2px; color: #ef4444;">Support: <span id="sup-val">--</span></div>
                                </div>
                            </div>
                            
                            <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                                <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 12px;">Last 30 Days (Daily)</h3>
                                <div class="table-container">
                                    <table class="historical-table" id="historical-table">
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Open</th>
                                                <th>High</th>
                                                <th>Low</th>
                                                <th>Close</th>
                                                <th>Volume</th>
                                            </tr>
                                        </thead>
                                        <tbody id="historical-body">
                                            <!-- Data injected here -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
